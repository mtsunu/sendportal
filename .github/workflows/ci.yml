on: push
name: Laravel CI
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: [
          "kirschbaumdevelopment/laravel-test-runner:8.2",
          "kirschbaumdevelopment/laravel-test-runner:8.3",
          "kirschbaumdevelopment/laravel-test-runner:8.4"
        ]

    container:
      image: ${{ matrix.container }}

    name: ${{ matrix.container }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sendportal_testing
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres
        env:
          POSTGRES_DB: sendportal_testing
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3
      - name: Verify Composer policy routes
        run: |
          git config --global --add safe.directory '*'
          php tests/Composer/ComposerPolicyGuardTest.php
          php tests/Composer/ComposerPolicyGuardTest.php --route-audit
      - name: Verify Composer manifest
        run: php bin/composer-policy validate --strict --no-interaction
      - name: Install composer dependencies
        run: php bin/composer-policy install -q --no-ansi --no-interaction --no-progress --prefer-dist
      - name: Check platform requirements
        run: php tools/composer/composer-2.10.2.phar check-platform-reqs --lock --no-interaction
      - name: Audit dependencies
        run: php bin/composer-policy audit --locked --no-interaction
      - name: Verify Laravel boot and SendPortal Core route registration
        run: |
          php artisan about
          php artisan route:list --no-ansi | grep -q sendportal.dashboard
      - name: Run Testsuite against MySQL
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: mysql
      - name: Run Testsuite against Postgres
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: postgres
